# Full stack (ADR-0014): `docker compose up --build`
#   web     http://localhost:8080
#   api     http://localhost:3000/api   (Swagger UI at /api/docs)
#   mongo   mongodb://localhost:27017
name: mentora

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/mentora
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:8080
      # Local default only: set JWT_SECRET in .env for any shared deployment (ADR-0018).
      JWT_SECRET: ${JWT_SECRET:-compose-local-jwt-secret-change-me-0123456789}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
