# Git hooks (ADR-0013). Installed automatically by `pnpm install`.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,ts,tsx,json,jsonc,css,grit}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    comments:
      glob: "*.{js,mjs,cjs,ts,tsx,css}"
      run: node tools/comments/check-comments.mjs
    class-diagram:
      glob: "apps/*/src/**/*.{ts,tsx}"
      run: node tools/docs/class-diagram.mjs --check

commit-msg:
  commands:
    conventional-commits:
      run: node tools/git/commit-msg.mjs {1}
